apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: privatebin
  namespace: privatebin
  annotations:
    bumpCount: "1"
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-api-system
  hostnames:
    - privatebin.production.k8s.evoteum.com
  rules:
    - backendRefs:
        - name: privatebin
          port: 8080
